# 演示内容剧本。每条会话对应 spec §10.3 表格的一行。
# 真跑用普通实例（DEMO_MODE=0），跑完人工定稿。
persona: 林知遥
conversations:
  - key: retrieval-selection
    note: 联网调研 + 多来源对比 + 落库；首屏高光会话
    skills: []
    turns:
      - text: >-
          我是独立开发者，长期做教育科技方向。工作日晚上通常只有约 1 小时可支配，
          请先给结论再给依据，用结构化中文 Markdown。
          我在做一个面向教培场景的 AI 学习产品，要给老师和学生的资料做检索。
          向量库这块现在有哪些主流选择，各自适合什么规模？帮我横向比一下。
        web_enabled: true
      - text: 我们初期数据量不大，但要本地部署、不能把资料传到外部服务。数据必须能留在本地，不接受把用户资料交给第三方。按这个约束再收敛一下。
        web_enabled: true
      - text: 把结论整理成一篇笔记存进知识库。
        web_enabled: false

  - key: chunking-experiment
    note: edit_doc 局部编辑；新建实验记录
    skills: []
    turns:
      - text: 打开那篇向量库选型的笔记，我们实测了几组分块参数，想把实测数据补进去。
        web_enabled: false
      - text: >-
          实测是这样：512 字无重叠召回偏低；512 字 + 80 字重叠明显变好；
          1024 字 + 150 字重叠在长文档上最好但短问答会带噪声。把这段补到笔记的对应小节。
        web_enabled: false
      - text: 另外把这次实验的完整过程单独记一篇实验记录。
        web_enabled: false

  - key: interview-notes
    note: 非结构化 → 结构化；AI 判断归位，用户全程不指定路径
    skills: []
    turns:
      - text: |-
          这是我今天跟一位初中数学老师聊完的原始记录，很乱，帮我整理一下：
          今晚大概八点开始，微信语音转的文字，对象化名王老师，教初二数学，两个班大概九十人。他说这学期几何证明和一次函数叠在一起，备课经常搞到十一点。资料主要来自学校共享盘，文件夹命名很乱，去年的卷子和今年的混在一起，搜「相似三角形专项」要翻很久。他自己也在网上下 pdf，收藏夹里几十个链接，打开才发现是别的年级。备一节课大约四十分钟找题、二十分钟改难度，写教学设计反而不是最长的。我问能不能用 AI 从已有资料里检索。他第一反应是怕，问学生作业和成绩会不会传到外面。我说可以本地部署、资料不出校，他松一点，但仍要求能关掉联网，校领导最怕这个。检索准不准他很在意：想找「含参数的一次函数与坐标轴交点」，结果常冒出小学线段图。宁可少给，也不要把错年级的题带进课堂。晚自习大概只有半小时看机器给的结果，必须一眼看到来源材料才能判断能不能用。如果能把找题砍到十分钟以内，他愿意先拿一个班试两周，但不要一上来自动组卷，他要自己过目。中间我问「学校有没有统一题库」问得不好，他愣了一下说有但没人用。还有「家长怎么看 AI」问早了，他不愿代表家长发言。反复被强调的就三句：来源要能点回去、年级和知识点要对、数据不能出校园。
        web_enabled: false
      - text: 这次访谈里有几个问题问得不好，帮我把有效的问题沉淀到访谈问题库里。
        web_enabled: false

  - key: merge-retrieval-docs
    note: 多文档合并的审阅会话；目录收敛
    skills: []
    turns:
      - text: 技术/检索 下面这几篇内容有重叠，读一下，然后告诉我该怎么合并才不丢信息。
        web_enabled: false
      - text: 按你说的合并方案来。
        web_enabled: false

  - key: weekly-report
    note: Skill 启用 → 读多篇资料 → 跑完整流程
    skills: ["技能/周报生成"]
    turns:
      - text: 按周报 Skill 出这周的周报。
        web_enabled: false

  - key: partnership-prep
    note: 跨会话记忆生效；未交代背景却引用访谈纪要与周报
    skills: []
    turns:
      - text: >-
          下周要跟一家教培机构谈合作，帮我准备一份材料。
          背景你这边应该已经有了，先看知识库和记忆，不要再问我产品是什么、用户是谁。
        web_enabled: false
      - text: >-
          对方最关心数据放在哪、会不会外传。结合已有访谈、技术选型和这周已经记下的进展来写，
          直接出一份可带去会议的材料，不要再向我要背景。
        web_enabled: false

  - key: data-flow-svg
    note: write_kb_file 生成 SVG，时间线内联预览（演示站不开放生图，靠预置记录展示）
    skills: []
    turns:
      - text: >-
          合作材料里「数据不出校园」那几层保障，对方看文字还是容易糊。
          根据已有的选型笔记和合作材料，画一张本地检索数据流示意图：
          老师资料如何进库、在哪做嵌入、检索结果如何带着来源回来，标清哪些环节完全在校内。
          请做成 SVG 矢量图写入知识库，我要在会谈时投屏；不要用 AI 生位图。
        web_enabled: false
      - text: 把这张示意图嵌进合作会谈材料里讲数据流向的那一节，正文里能看到图。
        web_enabled: false

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/lore.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <title>Lore</title>
    <script>
      (function () {
        try {
          var tones = { celadon: "light", ink: "dark", iris: "light", beige: "light" };
          var legacy = { light: "celadon", dark: "ink" };
          var t = localStorage.getItem("kb-theme");
          if (legacy[t]) t = legacy[t];
          if (!tones[t]) t = "celadon";
          document.documentElement.dataset.theme = t;
          document.documentElement.dataset.themeTone = tones[t];
        } catch (e) {
          document.documentElement.dataset.theme = "celadon";
          document.documentElement.dataset.themeTone = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

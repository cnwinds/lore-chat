name: lorechat-opensandbox-spike

services:
  opensandbox-server:
    image: opensandbox/server:latest
    container_name: lorechat-opensandbox-server
    ports:
      # 8090 已被 lorechat-web 占用；Spike 用 18090
      - "18090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config.toml:/etc/opensandbox/config.toml:ro
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      # Spike：无交互环境允许无 API key；正式接入必须设 api_key
      OPENSANDBOX_INSECURE_SERVER: "YES"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  default:
    name: lorechat-opensandbox-spike-net
